name: daily-predictions

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      # GBL history lives only in ESAKE HTML; keep the raw page cache between runs so a
      # run fetches just the live season's unfinished rounds (a cold cache refetches ~350 pages).
      - name: Restore GBL raw cache
        uses: actions/cache@v4
        with:
          path: data/raw/gbl
          key: gbl-raw-${{ github.run_id }}
          restore-keys: gbl-raw-
      # The team model (M1) needs box scores: keep the EuroLeague raw cache between runs too, so
      # only games finished since the last run are fetched (the first run fills 2023-24 on).
      - name: Restore EuroLeague raw cache
        uses: actions/cache@v4
        with:
          path: data/raw/euroleague
          key: euroleague-raw-${{ github.run_id }}
          restore-keys: euroleague-raw-
      - name: Ingest schedules and results
        run: |
          uv run --no-dev eurohoops ingest
      # Box scores of every default season (cached ones are never refetched); GBL also caches
      # the 2018-20 play-by-play the box-score fill uses, as the local build does.
      - name: Cache box scores for the team model
        run: |
          uv run --no-dev eurohoops ingest --details
          uv run --no-dev eurohoops ingest --competition gbl --details --pbp --seasons 2018 2019
      - name: Build marts
        run: uv run --no-dev eurohoops build
      # Market benchmark (EuroLeague only): one The Odds API call. The repository secret is
      # set by the owner; without it the step is skipped with a warning, never failed.
      - name: Record EuroLeague odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY secret is not set; skipping the odds recorder"
          else
            uv run --no-dev eurohoops odds
          fi
      - name: Predict upcoming games
        run: |
          uv run --no-dev eurohoops predict
          uv run --no-dev eurohoops predict --competition gbl
      - name: Score the live logs
        run: |
          uv run --no-dev eurohoops score
          uv run --no-dev eurohoops score --competition gbl
      - name: Export the site data
        run: uv run --no-dev eurohoops publish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site (Astro, into site/)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Commit predictions and reports if changed
        run: |
          git add predictions/ reports/ odds/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily predictions $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy-page:
    needs: predict
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
