<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-labelledby="pipeline-title pipeline-desc"><title id="pipeline-title">EuroHoops daily pipeline</title><desc id="pipeline-desc">The daily GitHub Actions run ingests EuroLeague and ESAKE data, parses it into DuckDB marts, predicts games with Elo and M1 using parameters tuned by walk-forward backtests, commits each forecast to an append-only log before tip-off, scores it against a baseline and market odds, and publishes the static site.</desc><defs><marker id="pipeline-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d6b66"/></marker><marker id="pipeline-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a78d6"/></marker></defs><rect width="100%" height="100%" fill="#f9f9f7"/><text x="16" y="24" fill="#111110" font-size="14" font-weight="600" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif">From raw data to a public, pre-registered forecast</text><rect x="16" y="40" width="968" height="220" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4,4"/><text x="32" y="58" fill="#6d6b66" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">GITHUB ACTIONS · EVERY DAY 08:00 UTC</text><line x1="148" y1="104" x2="171" y2="104" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><line x1="284" y1="104" x2="307" y2="104" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><line x1="420" y1="104" x2="443" y2="104" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><line x1="556" y1="104" x2="579" y2="104" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#pipeline-arr-accent)"/><line x1="692" y1="104" x2="715" y2="104" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><line x1="828" y1="104" x2="851" y2="104" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><line x1="364" y1="136" x2="364" y2="175" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><path d="M420,208 H492 Q500,208 500,200 V137" fill="none" stroke="#6d6b66" stroke-width="1" marker-end="url(#pipeline-arr-muted)"/><line x1="772" y1="176" x2="772" y2="137" stroke="#6d6b66" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pipeline-arr-muted)"/><rect x="422" y="188" width="68" height="12" rx="2" fill="#f9f9f7"/><text x="456" y="197" fill="#6d6b66" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TUNED PARAMS</text><rect x="36" y="72" width="112" height="64" rx="6" fill="#f9f9f7"/><rect x="36" y="72" width="112" height="64" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1"/><rect x="44" y="79" width="20" height="12" rx="2" fill="none" stroke="#6d6b66" stroke-opacity="0.45" stroke-width="0.8"/><text x="54.0" y="88" fill="#6d6b66" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">01</text><text x="92" y="110" fill="#111110" font-size="12" font-weight="600" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">Ingest</text><text x="92" y="125" fill="#6d6b66" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">EuroLeague · ESAKE</text><rect x="172" y="72" width="112" height="64" rx="6" fill="#f9f9f7"/><rect x="172" y="72" width="112" height="64" rx="6" fill="#fcfcfb" stroke="#52514e" stroke-width="1"/><rect x="180" y="79" width="20" height="12" rx="2" fill="none" stroke="#6d6b66" stroke-opacity="0.45" stroke-width="0.8"/><text x="190.0" y="88" fill="#6d6b66" font-size="7" font-family="'Geist Mono', ui-monospace, 